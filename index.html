    <meta name="theme-color" content="#eef5ea" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('undefeatedxi.theme') || localStorage.getItem('38-0-0.theme') || localStorage.getItem('invinciblexi.theme')
          const isDark = theme === 'dark'
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#08110c' : '#eef5ea')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
