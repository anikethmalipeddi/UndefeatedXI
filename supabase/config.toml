project_id = "undefeatedxi"

[auth]
site_url = "https://www.undefeatedxi.com"
additional_redirect_urls = []
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Uncomment and fill these when running local Supabase with Google OAuth.
# [auth.external.google]
# enabled = true
# client_id = "YOUR_GOOGLE_WEB_CLIENT_ID"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false

[functions.submit-run]
verify_jwt = true

[functions.share-run]
verify_jwt = false
